<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vue formateur</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* Vue formateur : tout suivre depuis son téléphone ou le poste du formateur, et projeter les textes au retour. */
.onglets{display:flex;gap:6px;flex-wrap:wrap;padding:10px max(16px,2vw);background:var(--carte);border-bottom:1px solid var(--trait);position:sticky;top:0;z-index:5}
.onglets button{border:2px solid var(--trait);background:var(--carte);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;color:var(--doux)}
.onglets button[aria-selected=true]{background:var(--plan);border-color:var(--plan);color:#fff}
.onglets button b{color:var(--chantier)}
.vue{max-width:1200px;margin:0 auto;padding:18px max(16px,2vw) 48px;display:grid;gap:16px}
.vue h2{font-size:24px}
.note{color:var(--doux);margin:0}
.tableau{overflow-x:auto;background:var(--carte);border:1px solid var(--trait);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--trait);vertical-align:top}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--doux)}
td img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.pastille{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.p-jamais{background:var(--ok-clair);color:var(--ok)}.p-parfois{background:var(--orange-clair);color:var(--chantier-fonce)}.p-souvent{background:var(--bleu-clair);color:var(--plan-2)}
.corr-liste{list-style:none;padding:0;margin:6px 0 10px;display:grid;gap:4px;font-size:15px}.corr-liste li{display:flex;gap:8px;align-items:baseline}.corr-liste .d{color:var(--doux)}
.p-ok{background:var(--ok-clair);color:var(--ok)}.p-ko{background:var(--alerte-clair);color:var(--alerte)}.p-neutre{background:var(--papier);color:var(--doux)}
.binomes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.binomes .carte{display:grid;gap:8px;padding:12px 14px}
.ateliers{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.atelier{display:grid;gap:10px}
.atelier h3{font-size:20px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.atelier h3 small{font-family:var(--f-texte);font-size:14px;color:var(--doux);font-weight:400}
.t-ligne{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;font-size:14px;border-top:1px dashed var(--trait);padding-top:8px}
.t-ligne .etats{display:flex;gap:4px;flex-wrap:wrap}
.alerte-carte{background:var(--alerte-clair);color:var(--alerte);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700}
details summary{cursor:pointer;color:var(--plan-2);font-weight:700}
.detail{display:grid;gap:8px;margin-top:8px}
.msg{white-space:pre-wrap;border-radius:10px;padding:8px 10px;font-size:14px}
.msg.user{background:var(--plan);color:#fff}.msg.assistant{background:#f3f1ec;border:1px solid var(--trait)}
.envoi{white-space:pre-wrap;background:#fcfbf8;border:1px solid var(--trait);border-left:4px solid var(--ok);border-radius:10px;padding:8px 10px;font-size:14px}
/* projection : gros caractères, côte à côte */
.projo{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.projo .carte{font-size:19px}
.projo .carte h3{font-size:22px;margin-bottom:8px}
.projo .texte{white-space:pre-wrap;line-height:1.5}
.choix-t{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.stats .carte{display:grid;gap:4px}
.stats b{font-family:var(--f-titre);font-size:32px;color:var(--plan)}
.barre{height:8px;border-radius:99px;background:var(--papier);overflow:hidden}.barre i{display:block;height:100%;background:var(--ok)}
.liens{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.liens a{display:grid;gap:2px;background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
.liens a b{color:var(--plan-2)}.liens a span{color:var(--doux);font-size:14px}
.chrono{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--plan);color:#fff;border-radius:16px;padding:14px 18px}
.chrono b{font-family:var(--f-titre);font-size:40px;line-height:1;min-width:120px}
.chrono span{opacity:.85;flex:1 1 200px}
.chrono .btn.clair{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.phases{display:grid;gap:10px}
.phase{display:grid;grid-template-columns:110px 1fr;gap:4px 16px;background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:12px 16px}
.phase.ici{border:3px solid var(--chantier);box-shadow:0 6px 20px rgba(232,105,44,.15)}
.phase.passee{opacity:.6}
.phase .h{font-family:var(--f-titre);font-weight:700;color:var(--plan)}
.phase h3{font-size:19px}
.phase p{margin:2px 0 6px;color:var(--doux);font-size:15px}
.phase .actions{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}
.phase .actions a,.phase .actions button{font-size:15px}
@media (max-width:600px){.phase{grid-template-columns:1fr}.phase .actions{grid-column:1}}
.grand{position:fixed;inset:0;background:var(--plan);color:#fff;z-index:40;display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer}
.grand b{font-family:var(--f-titre);font-size:clamp(28px,5.5vw,76px);word-break:break-all;line-height:1.1}
.grand span{display:block;margin-top:18px;font-size:22px;opacity:.8}
.grand b{cursor:text;user-select:all}
.grand .boutons-grand{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.grand .boutons-grand button{font:inherit;font-size:22px;font-weight:700;border-radius:14px;padding:12px 24px;cursor:pointer;border:2px solid #fff}
.grand .b-copier{background:#fff;color:var(--plan)}.grand .b-fermer{background:transparent;color:#fff}
/* 📺 télécommande : ce que montre l'écran projeté (ecran.html sur l'ordi du vidéoprojecteur), à piloter depuis le téléphone */
body{padding-bottom:150px}
.tele{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#14304f;color:#fff;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;gap:8px;box-shadow:0 -6px 20px rgba(0,0,0,.2)}
.tele-haut{display:flex;align-items:center;gap:10px;font-size:16px}.tele-haut span{flex:1}.tele-haut b{color:#F49A28}
.tele button{font:inherit;font-weight:700;border-radius:10px;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;padding:7px 12px;cursor:pointer}
.tele button.actif{background:#F49A28;border-color:#F49A28;color:#14304f}
.tele-ctrl{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.tele-ctrl:empty{display:none}
.tele-ctrl .gros{font-size:22px;padding:8px 22px;background:#fff;color:#14304f;border-color:#fff}
.tele-ctrl .ou{min-width:140px;text-align:center;font-weight:700}
.tele-choix{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.tele-choix button{flex:none;font-size:14px;padding:6px 10px}
.tele.replie .tele-ctrl,.tele.replie .tele-choix{display:none}
body.replie{padding-bottom:60px}
/* sur l'écran projeté, seulement les textes */
.mode-ecran .haut,.mode-ecran #onglets,.mode-ecran #mains,.mode-ecran #tele,.mode-ecran .choix-t{display:none!important}
body.mode-ecran{padding-bottom:0}.mode-ecran .vue{max-width:none}
/* correction du quiz à l'écran : une question à la fois, en très grand, sans aucun nom */
.cq{display:grid;gap:2.2vh;font-size:clamp(17px,min(2vw,3.4vh),34px);padding:2vh 2vw}
.cq .num{font-family:var(--f-titre);color:var(--chantier);font-weight:800;font-size:.8em}
.cq h2{font-size:clamp(24px,min(3.2vw,5.4vh),54px)!important;line-height:1.2}
.cq ul{list-style:none;padding:0;margin:0;display:grid;gap:1.4vh}.cq ul.deux{grid-template-columns:1fr 1fr}
.cq li{display:flex;gap:16px;align-items:center;border:3px solid var(--trait);border-radius:16px;padding:1.2vh 18px;background:#fff}
.cq li.bon{border-color:var(--ok);background:var(--ok-clair);font-weight:700}
.cq li .s{flex:none;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--papier);color:var(--doux)}
.cq li.bon .s{background:var(--ok);color:#fff}
.cq .pourquoi{border-left:8px solid var(--chantier);padding:10px 20px;background:#fff;border-radius:0 16px 16px 0}
.cq .classe{display:flex;gap:16px;align-items:center;color:var(--doux)}.cq .classe .barre{flex:1;height:18px}
#mains:empty{display:none}
#mains{position:sticky;top:0;z-index:40;background:#E8692C;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:18px}
#mains .m{background:#fff;color:#1b1f2e;border-radius:999px;padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;font-weight:700}
#mains .m small{font-weight:400;color:#666}
#mains .m button{font:inherit;font-size:15px;border:0;border-radius:999px;padding:6px 12px;background:#18355D;color:#fff;cursor:pointer}
</style>
</head>
<body>
<header class="haut"><div class="logo">B</div><div class="titre"><small>Vue formateur · <span id="salle"></span></small><b>L'IA dans les métiers de l'administratif</b></div>
  <nav><a id="l-proj" href="ecran.html" target="_blank" rel="noopener">📺 Écran projeté</a></nav></header>
<div id="mains" aria-live="polite"></div>
<div class="onglets" role="tablist" id="onglets"></div>
<main class="vue" id="vue"></main>
<div class="tele" id="tele"></div>

<script type="module">
import { app, db, SALLE, suffixe, $, esc, copier, toast } from './commun.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-functions.js';
import { TACHES, TACHES_SEANCE, QUESTIONS } from './donnees.js';
import { collection, doc, onSnapshot, setDoc, query, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const IMAGES = ['soleil', 'cafe', 'sommet', 'bouchon', 'fusee', 'hamac', 'dossiers', 'foret', 'graine', 'orage', 'arcenciel', 'bateau'];
const BASE = location.origin + location.pathname.replace(/formateur\.html$/, '');
const DOC_SEANCE = 'https://claude.ai/artifact/4HmhfTF1uaapV4wXq9YtvC';
$('salle').textContent = SALLE; $('l-proj').href = 'ecran.html' + suffixe;
// ouverte par l'écran projeté (?ecran=textes) : seulement les textes envoyés, en grand
const PARAMS = new URLSearchParams(location.search), MODE_ECRAN = ['textes', 'quiz'].includes(PARAMS.get('ecran')) ? PARAMS.get('ecran') : '';
if (MODE_ECRAN) document.body.classList.add('mode-ecran');

let ONGLET = (() => { try { return sessionStorage.getItem('onglet') || 'seance'; } catch { return 'seance'; } })();
let entrees = [], conf = {}, ateliers = {}, taches = {}, quiz = [], avis = [], projoTache = 2, ECRAN = {};
if (MODE_ECRAN === 'textes') { ONGLET = 'projeter'; projoTache = +PARAMS.get('t') === 2 ? 2 : 1; }
let questionEcran = Math.min(Math.max(+PARAMS.get('q') || 1, 1), 6);
if (MODE_ECRAN === 'quiz') {
  ONGLET = 'corrquiz';
  // l'écran projeté change de question sans recharger
  addEventListener('message', e => { if (e.origin === location.origin && Number.isInteger(e.data?.question)) { questionEcran = e.data.question; rendre(); } });
}
const ecoutes = {};

onSnapshot(query(collection(db, 'murs', SALLE, 'entrees'), orderBy('le')), s => { entrees = s.docs.map(d => d.data()); rendre(); });
onSnapshot(doc(db, 'murs', SALLE, 'config', 'seance'), s => { conf = s.data() || {}; rendre(); });
onSnapshot(collection(db, 'murs', SALLE, 'ateliers'), s => {
  // un atelier effacé disparaît aussi de la vue (sinon il reste jusqu'au rechargement)
  const ids = new Set(s.docs.map(d => d.id));
  Object.keys(ateliers).filter(id => !ids.has(id)).forEach(id => { ecoutes[id]?.(); delete ecoutes[id]; delete ateliers[id]; delete taches[id]; delete corrections[id]; });
  s.docs.forEach(d => {
    ateliers[d.id] = d.data();
    if (!ecoutes[d.id]) ecoutes[d.id] = onSnapshot(collection(db, 'murs', SALLE, 'ateliers', d.id, 'taches'), t => {
      taches[d.id] = {}; t.docs.forEach(x => taches[d.id][x.id] = x.data()); rendre(); corrigerBientot();
    });
  });
  rendre();
});
onSnapshot(query(collection(db, 'murs', SALLE, 'quiz'), orderBy('le')), s => { quiz = s.docs.map(d => d.data()); rendre(); });
onSnapshot(query(collection(db, 'murs', SALLE, 'avis'), orderBy('le')), s => { avis = s.docs.map(d => d.data()); rendre(); });
// ✋ mains levées : bandeau orange en haut, indépendant des onglets ; « C'est fait » baisse la main chez le stagiaire
const PAGES = { accueil: 'accueil', atelier: "à l'atelier", quiz: 'au quiz' };
let nbMains = 0;
onSnapshot(collection(db, 'murs', SALLE, 'mains'), s => {
  const l = s.docs.filter(d => d.data().active).sort((a, b) => (a.data().le?.seconds || 0) - (b.data().le?.seconds || 0));
  $('mains').innerHTML = l.length ? '<b>✋ Main levée :</b>' + l.map(d => `<span class="m">${esc(d.data().prenom)} <small>${PAGES[d.data().page] || ''}</small><button type="button" data-baisser="${esc(d.id)}">C'est fait</button></span>`).join('') : '';
  $('mains').querySelectorAll('[data-baisser]').forEach(b => b.onclick = () => { const v = s.docs.find(d => d.id === b.dataset.baisser).data(); setDoc(doc(db, 'murs', SALLE, 'mains', b.dataset.baisser), { prenom: v.prenom, page: v.page, active: false, le: serverTimestamp() }); });
  if (l.length > nbMains && !MODE_ECRAN) { try { const c = new AudioContext(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + .18); } catch {} }
  nbMains = l.length; document.title = (l.length ? `(✋ ${l.length}) ` : '') + 'Vue formateur';
});

const ONGLETS = [['seance', 'Ma séance', null], ['stagiaires', 'Stagiaires', () => entrees.length], ['ateliers', 'Ateliers en direct', () => Object.keys(ateliers).length],
  ['projeter', 'Projeter', null], ['quiz', 'Quiz', () => quiz.length], ['avis', 'Avis', () => avis.length], ['documents', 'Documents et liens', null]];

function rendre() {
  $('onglets').innerHTML = ONGLETS.map(([k, t, n]) => `<button role="tab" type="button" data-o="${k}" aria-selected="${k === ONGLET}">${t}${n ? ` <b>${n()}</b>` : ''}</button>`).join('');
  $('onglets').querySelectorAll('[data-o]').forEach(b => b.onclick = () => { ONGLET = b.dataset.o; try { sessionStorage.setItem('onglet', ONGLET); } catch {} rendre(); });
  const ouverts = [...document.querySelectorAll('details[open]')].map(d => d.dataset.k);
  const y = scrollY;
  const actif = document.activeElement?.id;
  if (actif?.startsWith('b-sel')) return;   // ne pas redessiner pendant un choix de binôme
  $('vue').innerHTML = ({ seance, stagiaires, ateliers: vueAteliers, projeter, quiz: vueQuiz, avis: vueAvis, documents, corrquiz })[ONGLET]();
  document.querySelectorAll('details').forEach(d => { if (ouverts.includes(d.dataset.k)) d.open = true; });
  scrollTo(0, y);
  brancher();
}

// ——— ma séance : le conducteur (horaires, ce qu'on projette à chaque moment), sans clé USB ———
const PHASES = [   // séance d'une heure (Parnel 15/11) : la présentation et un peu de pédagogie, sans surcharger
  [0, 10, 'Accueil et présentation', "Diapositives 1 à 4 : toi (photo, parcours), le titre, le cadre de la séance. Le mur au vidéoprojecteur : chacun scanne le QR code et remplit sa fiche (image, mot), puis se présente à l'oral en une phrase.",
    [['index.html#ecran', 'Mur et QR code'], ['diapos.html#1', 'Diapositives : moi, puis le cadre'], ['@stagiaires', 'Stagiaires']]],
  [10, 22, 'Apport démonstratif', "Diapositives 5 à 8 et trois démonstrations seulement : le courriel trop sec, Batifer inconnue (l'IA invente), la demande vague puis en 4 éléments.",
    [['diapos.html#5', 'Diapositives'], ['demo.html', 'Démonstration'], ['https://chat.mistral.ai', 'Le Chat (secours)']]],
  [22, 40, 'Mise en situation Batifer', "Diapositive 9, puis l'adresse de l'atelier en grand. Chacun seul, sur son poste : il tape son prénom. Un exercice : répondre à M. Durand ; la relance Imméka en bonus pour ceux qui vont vite. Tu passes aux postes. Passe d'abord voir les alertes rouges.",
    [['diapos.html#9', 'Diapositive « À vous »'], ['!atelier.html', 'Adresse de l\'atelier en grand'], ['@ateliers', 'Ateliers en direct']]],
  [40, 50, 'Retour et analyse', "Projette 2 textes anonymes : une bonne pratique, une erreur utile. Tu joues Mme Leroy : « Qu'avez-vous mis dans l'IA ? Corrigé ? Comment l'avez-vous vérifié ? »",
    [['@projeter', 'Projeter les textes envoyés']]],
  [50, 60, 'Bilan individuel', "Diapositive 10 et l'adresse du quiz : 6 questions, chacun seul, puis sa phrase et son avis. Termine sur les mots de l'accueil : « Qui changerait son mot ? »",
    [['diapos.html#10', 'Diapositive du bilan'], ['!quiz.html', 'Adresse du quiz en grand'], ['#corrquiz', 'Correction du quiz'], ['@quiz', 'Résultats du quiz'], ['index.html#ecran', 'Le mur et ses mots']]],
];
const cleDebut = 'debut-seance-' + SALLE;
// le départ du chronomètre est partagé (config/ecran) : le téléphone et l'ordi affichent le même temps
const debut = () => { if ('debut' in ECRAN) return ECRAN.debut || 0; try { return +localStorage.getItem(cleDebut) || 0; } catch { return 0; } };
const minutes = () => debut() ? (Date.now() - debut()) / 60000 : -1;
function seance() {
  const m = minutes();
  const lien = ([href, t]) => href.startsWith('@') ? `<button class="mini" type="button" data-o="${href.slice(1)}">${t}</button>`
    : versEcran(href) ? `<button class="mini" type="button" data-ecran="${versEcran(href)}">📺 ${t}</button>`
    : `<a class="mini" href="${esc(href.startsWith('http') ? href : href.replace(/^([^#]*)/, `$1${suffixe}`))}" target="_blank" rel="noopener">${t}</a>`;
  return `<div class="chrono"><b id="chrono">${m < 0 ? '0:00' : horloge(m)}</b><span id="chrono-txt">${m < 0 ? 'Lancez le chronomètre au début de la séance : la phase en cours s\'affiche en orange.' : phaseTexte(m)}</span>
      ${m < 0 ? '<button class="btn" type="button" id="b-debut">Démarrer la séance</button>' : '<button class="btn clair" type="button" id="b-zero">Remettre à zéro</button>'}</div>
    <p class="note">Tout s'ouvre dans le navigateur du poste du centre : pas besoin de clé USB. Le corrigé est dans <a href="${DOC_SEANCE}" target="_blank" rel="noopener">le déroulé complet</a>, sur votre téléphone.</p>
    <div class="phases">${PHASES.map(([a, b, titre, texte, liens], k) => `<div class="phase ${m >= a && m < b ? 'ici' : m >= b ? 'passee' : ''}" data-phase="${k}">
      <span class="h">${hm(a)} – ${hm(b)}</span><div><h3>${esc(titre)}</h3><p>${esc(texte)}</p></div>
      <div class="actions">${liens.map(lien).join('')}</div></div>`).join('')}</div>`;
}
const hm = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;   // horaires du déroulé : 0:10, 1:05
function horloge(m) { const t = Math.max(0, Math.floor(m * 60)); return `${Math.floor(t / 3600) ? Math.floor(t / 3600) + ':' : ''}${String(Math.floor(t / 60) % 60).padStart(Math.floor(t / 3600) ? 2 : 1, '0')}:${String(t % 60).padStart(2, '0')}`; }
function phaseTexte(m) {
  const k = PHASES.findIndex(([a, b]) => m >= a && m < b);
  if (k < 0) return m >= 60 ? 'Séance terminée : 1 h.' : '';
  const [, b, titre] = PHASES[k], reste = b - m;
  return `${titre} · encore ${Math.ceil(reste)} min`;
}
setInterval(() => {   // seulement le chronomètre et la phase en cours, sans tout redessiner
  if (ONGLET !== 'seance' || !debut()) return;
  const m = minutes(); if (!$('chrono')) return;
  $('chrono').textContent = horloge(m); $('chrono-txt').textContent = phaseTexte(m);
  document.querySelectorAll('[data-phase]').forEach(el => { const [a, b] = PHASES[+el.dataset.phase]; el.classList.toggle('ici', m >= a && m < b); el.classList.toggle('passee', m >= b); });
}, 1000);

// ——— stagiaires et binômes ———
function propositions() {
  const par = k => entrees.filter(f => f.ia === k), novices = par('jamais'), autres = [...par('souvent'), ...par('parfois'), ...entrees.filter(f => !f.ia)];
  const b = []; while (novices.length && autres.length) b.push([novices.shift(), autres.shift()]);

  return b.map(p => ({ a: p[0]?.prenom || '', b: p[1]?.prenom || '' }));

// ——— ateliers en direct ———
function etatTache(id, n) {
  const t = taches[id]?.[n] || {}, ms = t.messages || [], dem = ms.filter(m => m.role === 'user').length;
  const envoyees = (t.alertes || []).filter(a => a.envoye), evitees = (t.alertes || []).filter(a => !a.envoye);
  return { t, ms, dem, envoyees, evitees };
}
const pilote = (a, n) => a.b === 'Seul(e)' ? a.a : (n % 2 === 1 ? a.premier : (a.premier === a.a ? a.b : a.a));
// ✓ Correction : la grille est côté serveur (fonction correctionSeance), jamais dans ce dépôt public
const corrigerFn = httpsCallable(getFunctions(app, 'europe-west9'), 'correctionSeance', { timeout: 30000 });
let corrections = {}, minuteurCorr = null, signatureCorr = '';
function corrigerBientot() {
  const sig = Object.entries(taches).flatMap(([id, t]) => Object.entries(t).map(([n, v]) => id + n + (v.envoi?.heure || '') + (v.envoi?.texte?.length || ''))).join('|');
  if (sig === signatureCorr) return;
  signatureCorr = sig; clearTimeout(minuteurCorr);
  minuteurCorr = setTimeout(async () => { try { corrections = (await corrigerFn({ salle: SALLE })).data || {}; rendre(); } catch (e) { console.error(e); } }, 2500);
}
const symb = ok => ok === true ? '✓' : ok === false ? '✗' : '?';
function pastilleCorr(id, n) {
  const c = corrections[id]?.[n]; if (!c) return '';
  return `<span class="pastille ${c.bons === c.sur ? 'p-ok' : c.bons >= c.sur - 2 ? 'p-neutre' : 'p-ko'}" title="Correction automatique">correction ${c.bons}/${c.sur}</span>`;
}
function listeCorr(id, n) {
  const c = corrections[id]?.[n]; if (!c) return '';
  return `<p class="note" style="margin:8px 0 0"><b>Correction automatique : ${c.bons}/${c.sur}</b> (à confirmer en relisant le texte)</p><ul class="corr-liste">${c.points.map(p => `<li><span class="pastille ${p.ok === true ? 'p-ok' : p.ok === false ? 'p-ko' : 'p-neutre'}">${symb(p.ok)}</span><span><b>${esc(p.titre)}</b> <span class="d">· ${esc(p.detail)}</span></span></li>`).join('')}</ul>`;
}

// ——— quiz ———
function juste(q, rep) {
  if (rep == null) return false;
  if (q.type === 'vf') return rep === q.bon;
  if (q.type === 'un') return q.options.find(o => o[0] === rep)?.[2] === true;
  const bons = q.options.filter(o => o[2]).map(o => o[0]);
  return rep.length === bons.length && bons.every(b => rep.includes(b));
}
function vueQuiz() {
  if (!quiz.length) return `<h2>Quiz individuel</h2><p class="note">Personne n'a encore répondu (${esc(BASE)}quiz.html${esc(suffixe)}).</p>`;
  // le score est recalculé sur les questions actuelles (6) : les réponses d'avant (quiz de 9 questions) restent comparables
  const note = r => QUESTIONS.filter(q => juste(q, r.reponses?.[q.id])).length, SUR = QUESTIONS.length;
  const moy = quiz.reduce((s, r) => s + note(r), 0) / quiz.length;
  return `<h2>Quiz individuel</h2><div class="stats"><div class="carte"><span>Réponses</span><b>${quiz.length}</b></div><div class="carte"><span>Score moyen</span><b>${moy.toFixed(1).replace('.', ',')} / ${QUESTIONS.length}</b></div></div>
    <h2 style="font-size:20px">Question par question</h2><div class="stats">${QUESTIONS.map((q, i) => {
      const n = quiz.filter(r => juste(q, r.reponses?.[q.id])).length, p = Math.round(100 * n / quiz.length);
      return `<div class="carte"><span>${i + 1}. ${esc(q.court)}</span><strong>${n} / ${quiz.length} juste${n > 1 ? 's' : ''}</strong><div class="barre"><i style="width:${p}%;${p < 60 ? 'background:var(--alerte)' : ''}"></i></div></div>`;
    }).join('')}</div>
    <div class="tableau"><table><thead><tr><th>Prénom</th><th>Score</th>${QUESTIONS.map((q, i) => `<th title="${esc(q.court)}">${i + 1}</th>`).join('')}<th>Sa phrase</th></tr></thead><tbody>
    ${quiz.map(r => `<tr><td><b>${esc(r.prenom)}</b></td><td><span class="pastille ${note(r) >= SUR - 1 ? 'p-ok' : 'p-ko'}">${note(r)} / ${SUR}</span></td>${QUESTIONS.map(q => `<td>${juste(q, r.reponses?.[q.id]) ? '✓' : '<span style="color:var(--alerte);font-weight:700">✗</span>'}</td>`).join('')}<td>${esc(r.reponses?.phrase || '')}</td></tr>`).join('')}
    </tbody></table></div>`;

    g.querySelector('.b-copier').onclick = async e => { e.stopPropagation(); await copier(lien); e.target.textContent = 'Lien copié ✓'; toast('Lien copié : collez-le avec Ctrl + V.'); };
    g.querySelector('.b-fermer').onclick = () => g.remove();

}

  if (page === 'mur') ctrl = entrees.length ? `<button class="gros" data-t="f-1">←</button><span class="ou">${f ? esc(f.prenom) + ' en grand' : 'Tout le mur'}</span><button class="gros" data-t="f+1">→</button>${f ? '<button data-t="f0">Fermer</button>' : ''}` : "<span class='ou'>Personne au mur pour l'instant</span>";
  if (page === 'corrquiz') ctrl = `<button class="gros" data-t="q-1">←</button><span class="ou">Question ${E.question || 1} / ${QUESTIONS.length}</span><button class="gros" data-t="q+1">→</button>`;
  if (page === 'textes') ctrl = TACHES_SEANCE.map(n => `<button class="${(E.tache || 1) === n ? 'actif' : ''}" data-t="t${n}">${n === 1 ? "L'exercice" : 'Le bonus'}</button>`).join('');
  t.className = 'tele' + (replie ? ' replie' : ''); document.body.classList.toggle('replie', replie);
  t.innerHTML = `<div class="tele-haut"><span>📺 À l'écran : <b>${nom}</b></span><button type="button" data-t="replier" aria-label="${replie ? 'Déplier' : 'Replier'} la télécommande">${replie ? '▴' : '▾'}</button></div>
    <div class="tele-ctrl">${ctrl}</div>
    <div class="tele-choix">${CHOIX.map(([k, l]) => `<button type="button" class="${k === page ? 'actif' : ''}" data-c="${k}">${l}</button>`).join('')}</div>`;
  t.querySelectorAll('[data-c]').forEach(b => b.onclick = () => choisirEcran(b.dataset.c));
  t.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    const a = b.dataset.t, k = Number.isInteger(E.fiche) ? E.fiche : -1;
    if (a === 'replier') { replie = !replie; try { localStorage.setItem('tele-replie', replie ? '1' : '0'); } catch {} return rendreTele(); }
    if (a === 'd-1' || a === 'd+1') return mettreEcran({ diapo: Math.min(Math.max((E.diapo || 1) + (a === 'd+1' ? 1 : -1), 1), NB_DIAPOS) });
    if (a === 'f+1') return mettreEcran({ fiche: Math.min(k + 1, entrees.length - 1) });
    if (a === 'f-1') return mettreEcran({ fiche: Math.max(k - 1, -1) });
    if (a === 'f0') return mettreEcran({ fiche: -1 });
    if (a === 'q-1' || a === 'q+1') return mettreEcran({ question: Math.min(Math.max((E.question || 1) + (a === 'q+1' ? 1 : -1), 1), QUESTIONS.length) });
    if (a[0] === 't') return mettreEcran({ tache: +a.slice(1) });
  });
}
onSnapshot(REF_ECRAN, s => {
  const avant = ECRAN.debut;
  ECRAN = s.data() || {};
  rendreTele();
  if (ECRAN.debut !== avant && ONGLET === 'seance') rendre();
});
rendre(); rendreTele();
</script>
